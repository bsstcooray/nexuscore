version: '3.8'

services:
  # 1. Authoritative Relational Database (PostgreSQL 16+)
  postgres:
    image: postgres:16-alpine
    container_name: nexuscore_postgres
    restart: always
    environment:
      POSTGRES_DB: nexuscore_db
      POSTGRES_USER: nexus_admin
      POSTGRES_PASSWORD: NexusCorePassword2026!
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/01_schema_27_entities.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_stored_procedures.sql:/docker-entrypoint-initdb.d/02_procedures.sql:ro
      - ./database/03_triggers_and_audit.sql:/docker-entrypoint-initdb.d/03_triggers.sql:ro
      - ./database/04_indexes_and_perf.sql:/docker-entrypoint-initdb.d/04_indexes.sql:ro
      - wal_archive:/var/lib/postgresql/wal_archive
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='cp %p /var/lib/postgresql/wal_archive/%f'
      -c max_wal_senders=3
      -c checkpoint_completion_target=0.9
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_admin -d nexuscore_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Application
  backend:
    build:
      context: .
      dockerfile: devops/Dockerfile.backend
    container_name: nexuscore_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://nexus_admin:NexusCorePassword2026!@postgres:5432/nexuscore_db
      SECRET_KEY: nexuscore-production-security-salt-2026
      DEBUG: "False"
    ports:
      - "8000:8000"

  # 3. Decoupled GitHub Sync Worker
  github-sync:
    build:
      context: .
      dockerfile: devops/Dockerfile.backend
    container_name: nexuscore_github_sync
    restart: always
    depends_on:
      - backend
    environment:
      DATABASE_URL: postgresql+psycopg2://nexus_admin:NexusCorePassword2026!@postgres:5432/nexuscore_db
    command: python services/github_sync_service.py

volumes:
  pgdata:
  wal_archive:
